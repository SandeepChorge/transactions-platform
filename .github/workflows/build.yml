name: Build & Release

# The filename must stay build.yml. GitHub keys a workflow by its file path, so renaming
# this file registers a new workflow and restarts github.run_number at 1 — and run_number
# is the source of both versionCode and the patch component of versionName. See issue #9.

on:
  push:
    branches: [main]
  # 'closed' is needed for the RELEASE_ANDROID_BUILD flag: a push event carries no pull
  # request description, so this is the only event that exposes the body to read it from.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      channel:
        description: "Where to send the signed artifacts"
        type: choice
        options: [none, firebase, play, both]
        default: "none"

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Positive patterns only. These filters previously carried '!.../**/*.md'
          # exclusions, which made all three of them match everything: paths-filter ORs
          # its patterns rather than subtracting the negations, so '!web/**/*.md' matched
          # every file that is not a markdown file under web/ — including every Android
          # source file. All three filters had been returning true on every run.
          #
          # The cost of dropping them is that a markdown-only change inside a project
          # directory now runs that project's job. That is a cheap `./gradlew test`,
          # and far cheaper than a filter that silently does nothing.
          filters: |
            android:
              - 'transactions-parser-android/**'
            web:
              - 'transactions-parser-web/**'
              - 'shared/api-contract/**'
            api:
              - 'services/transactions-api/**'
              - 'shared/api-contract/**'

  android:
    needs: changes
    # always() is required because `changes` is skipped entirely on workflow_dispatch,
    # and a skipped dependency would otherwise skip this job too.
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true')
      && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transactions-parser-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # gradle.properties is gitignored (it holds the Google OAuth client ID), so CI has to
      # create it. Derive it from the tracked example rather than writing just the one
      # property we need: appending only the client ID left CI on Gradle's stock 512m heap
      # and 384m metaspace while developers build with 2048m/768m, and the release build
      # died inside the daemon with nothing pointing at the two environments differing.
      # Anything build-affecting therefore belongs in gradle.properties.example.
      - name: Write gradle.properties
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          sed "s|^GOOGLE_WEB_CLIENT_ID=.*|GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}|" \
            gradle.properties.example > gradle.properties
          if ! grep -q '^GOOGLE_WEB_CLIENT_ID=.\+' gradle.properties; then
            echo "::error::The GOOGLE_WEB_CLIENT_ID secret is empty. The build would succeed and Google Sign-In would fail at runtime."
            exit 1
          fi
      - run: ./gradlew test --no-daemon

  # Cheap job: decides whether this run releases anything, and says so out loud.
  # Split from the build so that a merged pull request with no flag costs seconds
  # rather than a full signed build.
  release-gate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      channel: ${{ steps.decide.outputs.channel }}
    steps:
      - name: Resolve channel
        id: decide
        env:
          # Read through the environment, never interpolated into the script body: a pull
          # request description is attacker-controllable text and `${{ }}` inside a run
          # block is substituted before the shell ever sees it.
          PR_BODY: ${{ github.event.pull_request.body }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD=true
            CHANNEL="$DISPATCH_CHANNEL"
            REASON="Manual dispatch, channel \`$CHANNEL\`."
          # The flag must sit alone on its own line. A plain substring match would fire on
          # any description that merely *mentions* the flag — including a pull request
          # documenting how the flag works, which is how this was found.
          #
          # Case-insensitive, and tolerant of spacing, on purpose: the failure mode here is
          # a typo, and a flag that silently does nothing is indistinguishable from a
          # working pipeline with nothing to ship — hence the outcome is always written below.
          elif printf '%s' "$PR_BODY" | tr -d '\r' \
            | grep -qiE '^[[:space:]]*RELEASE_ANDROID_BUILD[[:space:]]*=[[:space:]]*true[[:space:]]*$'; then
            BUILD=true
            CHANNEL=play
            REASON="\`RELEASE_ANDROID_BUILD=true\` found in the description of #${{ github.event.pull_request.number }} — releasing to the Play **internal** track."
          else
            BUILD=false
            CHANNEL=none
            REASON="No \`RELEASE_ANDROID_BUILD=true\` in the description of #${{ github.event.pull_request.number }} — nothing built, nothing published."
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          {
            echo "### Release decision"
            echo ""
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  android-release:
    needs: [android, release-gate]
    # always() is required for the same reason it is on `android`, one level further out.
    # GitHub's implicit success() walks the whole ancestor graph, not just the direct
    # needs: on workflow_dispatch `changes` is skipped, and that skip propagates down
    # through `android` — which survives it via always() — to kill this job, even though
    # both jobs this one names succeeded. The result was a dispatch that resolved
    # build=true and then released nothing, with every job green.
    #
    # This does not weaken the gate. Both real conditions are still asserted explicitly
    # below, and a cancelled run leaves android.result as 'cancelled', which fails them.
    if: >-
      always()
      && needs.release-gate.outputs.build == 'true'
      && needs.android.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transactions-parser-android
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly what landed on main, not the pull request's merge preview.
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same derivation as the `android` job — see the comment there.
      - name: Write gradle.properties
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          sed "s|^GOOGLE_WEB_CLIENT_ID=.*|GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}|" \
            gradle.properties.example > gradle.properties
          if ! grep -q '^GOOGLE_WEB_CLIENT_ID=.\+' gradle.properties; then
            echo "::error::The GOOGLE_WEB_CLIENT_ID secret is empty. A release build would ship with Google Sign-In broken."
            exit 1
          fi

      - name: Calculate version
        id: version
        run: |
          set -euo pipefail
          MAJOR=$(grep -E '^major=' version.properties | cut -d= -f2)
          MINOR=$(grep -E '^minor=' version.properties | cut -d= -f2)
          SHIFT=$(grep -E '^codeShift=' version.properties | cut -d= -f2)
          PATCH=${{ github.run_number }}
          echo "code=$((PATCH + SHIFT))" >> "$GITHUB_OUTPUT"
          echo "name=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add it before cutting a release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Exported rather than passed inline so the path never appears in a log line.
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_STRING: ${{ steps.version.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # APK for Firebase, AAB for Play — both from one run, so the two channels can
        # never be serving different builds of the same version.
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.name }}
          path: |
            transactions-parser-android/app/build/outputs/apk/release/*.apk
            transactions-parser-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Record version and checksums
        run: |
          set -euo pipefail
          {
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| versionName | \`${{ steps.version.outputs.name }}\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\` |"
            echo "| Channel | \`${{ needs.release-gate.outputs.channel }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "**Artifact checksums**"
            echo ""
            echo '```'
            find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec shasum -a 256 {} \;
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded with firebase-tools directly rather than a third-party action. By this
      # point the job has already held the signing key, so every additional action running
      # here is one more supply chain with access to the release path — the CLI keeps that
      # surface to npm alone.
      - name: Distribute to Firebase App Distribution
        if: needs.release-gate.outputs.channel == 'firebase' || needs.release-gate.outputs.channel == 'both'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::FIREBASE_APP_ID is not set. Add it before dispatching with channel 'firebase'."
            exit 1
          fi

          # A truncated or mis-pasted service account key is indistinguishable from a good
          # one until the upload dies with a bare 403 that names nothing. Assert the two
          # fields that must exist, so the failure points at the secret instead.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          if ! jq -e '.client_email and .private_key' "$RUNNER_TEMP/firebase-sa.json" >/dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not a service account key — no client_email/private_key. Re-paste the whole JSON file, braces included."
            exit 1
          fi

          # The only trace a tester has of what they are running. A static string here
          # would make two builds of the same version indistinguishable on the device.
          printf '%s (build %s)\n\nCommit: %s\nBuild:  %s\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA" "$RUN_URL" \
            > "$RUNNER_TEMP/release-notes.txt"

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"

          # Pinned to the version that made the first green upload (run 32868396249). npx
          # resolves 'latest' otherwise, so an upstream release could break a release run
          # with no change on our side. Bump deliberately, not by drift.
          npx --yes firebase-tools@15.28.1 --version

          # 'testers' is the group alias, not its display name. The two can differ, and a
          # wrong alias fails as "group not found" rather than uploading to nobody.
          npx --yes firebase-tools@15.28.1 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups testers \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"

          {
            echo ""
            echo "Distributed \`$VERSION_NAME\` to the **testers** group on Firebase App Distribution."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

      # Uploaded with fastlane supply rather than a third-party publish action, for the same
      # reason the Firebase step uses the CLI: this job has already decoded and used the
      # signing key, so anything else executing here is one more supply chain sitting on the
      # release path. One pinned gem, bumped deliberately rather than by drift.
      - name: Upload to Play internal track
        if: needs.release-gate.outputs.channel == 'play' || needs.release-gate.outputs.channel == 'both'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set. Add it before dispatching with channel 'play'."
            exit 1
          fi

          # Same assertion as the Firebase step, for the same reason: a truncated key fails
          # as a bare 403 that names nothing. Point at the secret instead.
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"
          if ! jq -e '.client_email and .private_key' "$RUNNER_TEMP/play-sa.json" >/dev/null 2>&1; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not a service account key — no client_email/private_key. Re-paste the whole JSON file, braces included."
            exit 1
          fi

          # supply reads changelogs from <metadata_path>/android/<lang>/changelogs/<code>.txt.
          # Built here rather than committed so the notes carry the commit and the run, which
          # is the only trace of what a given build actually contains.
          CHANGELOG_DIR="$RUNNER_TEMP/play-metadata/android/en-US/changelogs"
          mkdir -p "$CHANGELOG_DIR"
          printf '%s (build %s)\n\nCommit: %s\nBuild:  %s\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA" "$RUN_URL" \
            > "$CHANGELOG_DIR/$VERSION_CODE.txt"

          gem install fastlane -v 2.228.0 --no-document
          fastlane supply --version

          # The skip_upload_* flags are not optional tidiness. supply's default is to sync
          # store metadata, images and screenshots from disk — and with none present that
          # syncs *emptiness* over the live listing. Only the changelog is opted in.
          fastlane supply \
            --package_name com.madtitan94.transactionsparser \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --release_status completed \
            --json_key "$RUNNER_TEMP/play-sa.json" \
            --metadata_path "$RUNNER_TEMP/play-metadata" \
            --skip_upload_apk true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true

          {
            echo ""
            echo "Uploaded \`$VERSION_NAME\` (code \`$VERSION_CODE\`) to the Play **internal** track."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Play credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/play-sa.json"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "transactions-parser-web not scaffolded yet — nothing to build"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "transactions-api not scaffolded yet — nothing to build"
