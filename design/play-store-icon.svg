<!--
  Statement Sense — Play Store listing icon.

  The same artwork as the launcher's adaptive icon (app/src/main/res/drawable/ic_launcher_*.xml),
  kept in one 108-unit coordinate space so the two cannot drift apart. The difference is that this
  one is flattened: Play requires a 512 x 512 PNG with no transparency and applies its own corner
  masking, so the background is painted here rather than living in a separate layer.

  To export:
      Open in any browser at 512 x 512 and screenshot, or

      rsvg-convert -w 512 -h 512 design/play-store-icon.svg -o play-store-icon.png

  Android Studio's Image Asset Studio can also regenerate the launcher icons from the same paths.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E2E27"/>
      <stop offset="1" stop-color="#0F1714"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" fill="url(#ground)"/>

  <g fill="none" stroke="#FFB020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M41,28 H67 A7,7 0 0 1 74,35 V73 A7,7 0 0 1 67,80 H41 A7,7 0 0 1 34,73 V35 A7,7 0 0 1 41,28 Z"/>
    <path d="M43,40 H62"/>
    <path d="M43,49 H55"/>
    <path d="M43,71 L51,62 L58,67 L66,56"/>
  </g>
</svg>
