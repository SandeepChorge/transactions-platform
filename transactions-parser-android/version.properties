# App version. See issue #9.
#
# MAJOR and MINOR are owned here so a version bump is a reviewed one-line diff.
# PATCH is the CI run counter and is NOT stored — it arrives as APP_VERSION_STRING.
# Local builds fall back to <major>.<minor>.0 with versionCode 1.
major=1
minor=0

# Added to the CI run number to produce versionCode. Affects versionCode ONLY —
# versionName is always <major>.<minor>.<run_number> and ignores this value.
#
# Zero, so versionCode equals the run number and a published build maps straight back
# to the CI run that produced it.
#
# This is a knob, not a one-time decision. github.run_number is not derived from
# anything in this repository and restarts at 1 if the workflow is ever recreated or
# its file renamed. A versionCode already published to Play can never be reused, so if
# that reset ever happens, raise this to (highest published versionCode) to resume
# above the existing series rather than colliding with it.
codeShift=0
